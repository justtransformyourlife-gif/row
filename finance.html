<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Cashflow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg:      #050506;
  --bg-card: rgba(255,255,255,0.036);
  --border:  rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.13);
  --text-1:  #FAFAFA;
  --text-2:  #B8B6B0;
  --text-3:  #76746E;
  --emerald: #6BE3A4;
  --emerald-dim: rgba(107,227,164,0.12);
  --danger:  #FF6B6B;
  --danger-dim:  rgba(255,107,107,0.10);
  --gold:    #F2C063;
  --font:    -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text-1);
  font-family: var(--font); -webkit-font-smoothing: antialiased;
  min-height: 100vh; scrollbar-width: none;
}
*::-webkit-scrollbar { display: none; }
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 60% 45% at 80% 10%,  rgba(107,227,164,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 15% 90%, rgba(242,192,99,0.05)  0%, transparent 55%);
  pointer-events: none;
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 3px 3px; pointer-events: none;
}

.page {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 0 16px 120px;
}

/* ── hero ── */
.hero {
  padding: 24px 0 20px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 12px;
}
.hero-left {}
.page-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; color: var(--text-3); text-transform: uppercase;
  margin-bottom: 4px;
}
.net-val {
  font-size: 52px; font-weight: 800; font-family: var(--font-mono);
  letter-spacing: -0.03em; line-height: 1;
}
.net-val.pos { color: var(--emerald); }
.net-val.neg { color: var(--danger); }
.net-val.zero { color: var(--text-2); }
.net-sub {
  font-size: 12px; color: var(--text-3); margin-top: 4px;
  font-family: var(--font-mono); letter-spacing: 0.06em;
}

.month-picker {
  display: flex; align-items: center; gap: 8px;
}
.month-arrow {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.04);
  color: var(--text-2); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: all 0.15s;
}
.month-arrow:hover { background: rgba(255,255,255,0.09); color: var(--text-1); }
.month-label {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-2);
  letter-spacing: 0.08em; min-width: 68px; text-align: center;
}

/* ── stat bars ── */
.stat-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px;
}
.stat-card.income  { border-color: rgba(107,227,164,0.2); }
.stat-card.expense { border-color: rgba(255,107,107,0.18); }
.stat-lbl {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
}
.stat-amt {
  font-size: 26px; font-weight: 700; font-family: var(--font-mono);
  letter-spacing: -0.02em; line-height: 1; margin-bottom: 10px;
}
.stat-amt.inc { color: var(--emerald); }
.stat-amt.exp { color: var(--danger); }
.stat-bar-track {
  height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden;
}
.stat-bar-fill {
  height: 100%; border-radius: 3px; min-width: 3px;
  transition: width 0.55s cubic-bezier(.4,0,.2,1);
}
.stat-bar-fill.inc { background: linear-gradient(90deg, var(--emerald), rgba(107,227,164,0.5)); }
.stat-bar-fill.exp { background: linear-gradient(90deg, var(--danger),  rgba(255,107,107,0.5)); }
.stat-count { font-size: 10px; color: var(--text-3); margin-top: 5px; font-family: var(--font-mono); }

/* ── action buttons ── */
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.btn-big {
  padding: 16px 12px; border: none; border-radius: 14px;
  font-family: inherit; font-size: 12px; font-weight: 800;
  letter-spacing: 0.07em; cursor: pointer; transition: all 0.18s;
  -webkit-tap-highlight-color: transparent; line-height: 1.3; text-align: center;
}
.btn-big.inflow {
  background: rgba(107,227,164,0.12); border: 1px solid rgba(107,227,164,0.28);
  color: var(--emerald);
}
.btn-big.inflow:hover  { background: rgba(107,227,164,0.22); }
.btn-big.outflow {
  background: rgba(255,107,107,0.09); border: 1px solid rgba(255,107,107,0.22);
  color: var(--danger);
}
.btn-big.outflow:hover { background: rgba(255,107,107,0.18); }
.btn-big-icon { font-size: 20px; display: block; margin-bottom: 5px; }
.btn-big-lbl  { display: block; }

/* ── transaction list ── */
.section-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.section-title {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.16em; color: var(--text-3); text-transform: uppercase;
}
.tx-filter {
  display: flex; gap: 4px;
}
.filter-btn {
  padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: transparent; color: var(--text-3);
  cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
.filter-btn.active { background: rgba(255,255,255,0.09); color: var(--text-1); border-color: var(--border-strong); }

.tx-list { display: flex; flex-direction: column; gap: 6px; }
.tx-empty {
  text-align: center; padding: 32px 0; font-size: 13px;
  color: var(--text-3); font-style: italic;
}
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: 13px;
  background: var(--bg-card); border: 1px solid var(--border);
  transition: background 0.15s;
}
.tx-item:hover { background: rgba(255,255,255,0.055); }
.tx-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tx-dot.in  { background: var(--emerald); box-shadow: 0 0 8px rgba(107,227,164,0.5); }
.tx-dot.out { background: var(--danger);  box-shadow: 0 0 8px rgba(255,107,107,0.4); }
.tx-info { flex: 1; min-width: 0; }
.tx-desc { font-size: 13px; color: var(--text-1); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-date { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); margin-top: 1px; }
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amt { font-family: var(--font-mono); font-size: 15px; font-weight: 700; }
.tx-amt.in  { color: var(--emerald); }
.tx-amt.out { color: var(--danger); }
.tx-del {
  background: transparent; border: none; color: var(--text-3); font-size: 16px;
  cursor: pointer; padding: 4px 6px; border-radius: 6px; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent; transition: color 0.15s;
}
.tx-del:hover { color: var(--danger); }

/* ── modal ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.72); backdrop-filter: blur(10px);
  z-index: 300; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 380px;
  background: #111115; border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 22px;
}
.modal-hd {
  font-size: 16px; font-weight: 700; margin-bottom: 16px;
}
.modal-hd.inflow  { color: var(--emerald); }
.modal-hd.outflow { color: var(--danger); }
.m-field { margin-bottom: 11px; }
.m-field label {
  display: block; font-size: 10px; color: var(--text-3);
  letter-spacing: 0.09em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px;
}
.m-field input, .m-field select {
  width: 100%;
  background: rgba(0,0,0,0.32); border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text-1);
  font-family: inherit; font-size: 16px; padding: 11px 13px; outline: none;
  transition: border-color 0.2s;
}
.m-field input:focus, .m-field select:focus { border-color: rgba(107,227,164,0.38); }
.m-row { display: flex; gap: 8px; margin-top: 16px; }
.m-cancel {
  flex: 1; padding: 12px; border: 1px solid var(--border);
  background: transparent; color: var(--text-2); border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
.m-confirm {
  flex: 2; padding: 12px; border: none; border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
}
.m-confirm.inflow  { background: var(--emerald); color: #050506; }
.m-confirm.outflow { background: var(--danger);  color: #fff; }

@media (max-width: 480px) {
  .page { padding: 0 12px 100px; }
  .net-val { font-size: 40px; }
  .stat-row { gap: 9px; }
  .action-row { gap: 9px; }
}
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="hero-left">
      <div class="page-label">Net Cashflow</div>
      <div class="net-val" id="netVal">$0</div>
      <div class="net-sub" id="netSub">— this month</div>
    </div>
    <div class="month-picker">
      <button class="month-arrow" id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel">—</span>
      <button class="month-arrow" id="nextMonth">›</button>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card income">
      <div class="stat-lbl">Total Income</div>
      <div class="stat-amt inc" id="totalInc">$0</div>
      <div class="stat-bar-track"><div class="stat-bar-fill inc" id="incBar" style="width:50%"></div></div>
      <div class="stat-count" id="incCount">0 payments</div>
    </div>
    <div class="stat-card expense">
      <div class="stat-lbl">Total Expenses</div>
      <div class="stat-amt exp" id="totalExp">$0</div>
      <div class="stat-bar-track"><div class="stat-bar-fill exp" id="expBar" style="width:50%"></div></div>
      <div class="stat-count" id="expCount">0 expenses</div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-big inflow" id="btnInflow">
      <span class="btn-big-icon">💸</span>
      <span class="btn-big-lbl">+ MENTORSHIP<br>PAYMENT</span>
    </button>
    <button class="btn-big outflow" id="btnOutflow">
      <span class="btn-big-icon">📤</span>
      <span class="btn-big-lbl">− SETTER<br>EXPENSE</span>
    </button>
  </div>

  <div class="section-hd">
    <span class="section-title">Transactions</span>
    <div class="tx-filter">
      <button class="filter-btn active" data-f="all" id="fAll">All</button>
      <button class="filter-btn" data-f="in"  id="fIn">In</button>
      <button class="filter-btn" data-f="out" id="fOut">Out</button>
    </div>
  </div>
  <div class="tx-list" id="txList"></div>

</div>

<!-- Modal -->
<div class="modal-bg" id="cfModal">
  <div class="modal">
    <div class="modal-hd" id="cfModalHd">+ Mentorship Payment</div>
    <div class="m-field">
      <label>Amount (USD)</label>
      <input type="number" id="cfAmt" placeholder="3000" min="0" step="1">
    </div>
    <div class="m-field">
      <label>Category</label>
      <select id="cfCat">
        <option value="">— select —</option>
        <optgroup label="Income" id="catIncome">
          <option value="Mentorship payment">Mentorship payment</option>
          <option value="Coaching program">Coaching program</option>
          <option value="Upsell / upgrade">Upsell / upgrade</option>
          <option value="Other income">Other income</option>
        </optgroup>
        <optgroup label="Expenses" id="catExpense">
          <option value="Setter retainer">Setter retainer</option>
          <option value="Setter commission">Setter commission</option>
          <option value="Software / tools">Software / tools</option>
          <option value="Ads">Ads</option>
          <option value="Other expense">Other expense</option>
        </optgroup>
      </select>
    </div>
    <div class="m-field">
      <label>Note (optional)</label>
      <input type="text" id="cfNote" placeholder="e.g. John — 3-month close">
    </div>
    <div class="m-row">
      <button class="m-cancel" id="cfCancel">Cancel</button>
      <button class="m-confirm inflow" id="cfConfirm">Add</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

const K_CF = 'jarvis_cf';
const $ = id => document.getElementById(id);

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function fmtMoney(n) {
  return '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}

// State
function loadCF() {
  try { return JSON.parse(localStorage.getItem(K_CF) || 'null') || { transactions: [] }; }
  catch (e) { return { transactions: [] }; }
}
function saveCF() { localStorage.setItem(K_CF, JSON.stringify(cf)); }

let cf = loadCF();
let activeFilter = 'all';

// Month navigation
const now = new Date();
let viewYear  = now.getFullYear();
let viewMonth = now.getMonth(); // 0-indexed

function monthPrefix() {
  return viewYear + '-' + String(viewMonth + 1).padStart(2, '0');
}

function monthTxs() {
  const prefix = monthPrefix();
  return cf.transactions.filter(t => t.date.startsWith(prefix));
}

function filteredTxs() {
  const txs = monthTxs();
  if (activeFilter === 'in')  return txs.filter(t => t.type === 'in');
  if (activeFilter === 'out') return txs.filter(t => t.type === 'out');
  return txs;
}

function renderAll() {
  $('monthLabel').textContent = MONTHS[viewMonth] + ' ' + String(viewYear).slice(2);

  const txs   = monthTxs();
  const inc   = txs.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const exp   = txs.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  const net   = inc - exp;
  const maxV  = Math.max(inc, exp, 1);

  // Hero
  const netEl = $('netVal');
  netEl.textContent = (net >= 0 ? '+' : '-') + fmtMoney(net);
  netEl.className   = 'net-val ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero');

  // Stat cards
  $('totalInc').textContent = fmtMoney(inc);
  $('totalExp').textContent = fmtMoney(exp);
  $('incBar').style.width   = (inc / maxV * 100) + '%';
  $('expBar').style.width   = (exp / maxV * 100) + '%';
  $('incCount').textContent = txs.filter(t => t.type === 'in').length + ' payments';
  $('expCount').textContent = txs.filter(t => t.type === 'out').length + ' expenses';

  // Transaction list
  const list = filteredTxs().slice().reverse();
  if (!list.length) {
    $('txList').innerHTML = '<div class="tx-empty">No transactions for this period</div>';
    return;
  }
  $('txList').innerHTML = list.map(t =>
    `<div class="tx-item">
      <div class="tx-dot ${t.type}"></div>
      <div class="tx-info">
        <div class="tx-desc">${esc(t.cat || t.desc || (t.type === 'in' ? 'Payment' : 'Expense'))}</div>
        <div class="tx-date">${t.date}${t.note ? ' · ' + esc(t.note) : ''}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amt ${t.type}">${t.type === 'in' ? '+' : '-'}${fmtMoney(t.amount)}</div>
      </div>
      <button class="tx-del" data-id="${t.id}" aria-label="Delete">×</button>
    </div>`
  ).join('');

  $('txList').querySelectorAll('.tx-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      cf.transactions = cf.transactions.filter(t => t.id !== id);
      saveCF(); renderAll();
    });
  });
}

// Month navigation
$('prevMonth').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderAll();
});
$('nextMonth').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderAll();
});

// Filter tabs
['fAll','fIn','fOut'].forEach(id => {
  $(id).addEventListener('click', () => {
    activeFilter = $(id).dataset.f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    $(id).classList.add('active');
    renderAll();
  });
});

// Modal
let cfMode = 'in';

function openModal(mode) {
  cfMode = mode;
  const isIn = mode === 'in';
  $('cfModalHd').textContent  = isIn ? '+ Mentorship Payment' : '− Setter Expense';
  $('cfModalHd').className    = 'modal-hd ' + (isIn ? 'inflow' : 'outflow');
  $('cfConfirm').className    = 'm-confirm ' + (isIn ? 'inflow' : 'outflow');
  $('cfConfirm').textContent  = isIn ? 'Log Payment' : 'Log Expense';

  // Show/hide category groups
  $('catIncome').style.display  = isIn  ? '' : 'none';
  $('catExpense').style.display = !isIn ? '' : 'none';
  $('cfCat').value = '';
  $('cfAmt').value = ''; $('cfNote').value = '';
  $('cfModal').classList.add('show');
  setTimeout(() => $('cfAmt').focus(), 50);
}

$('btnInflow').addEventListener('click',  () => openModal('in'));
$('btnOutflow').addEventListener('click', () => openModal('out'));
$('cfCancel').addEventListener('click',   () => $('cfModal').classList.remove('show'));
$('cfModal').addEventListener('click', e => { if (e.target === $('cfModal')) $('cfModal').classList.remove('show'); });

$('cfConfirm').addEventListener('click', () => {
  const amt = parseFloat($('cfAmt').value);
  if (!amt || amt <= 0) { $('cfAmt').focus(); return; }
  const cat  = $('cfCat').value   || (cfMode === 'in' ? 'Mentorship payment' : 'Setter expense');
  const note = $('cfNote').value.trim();
  const today = new Date();
  const dateStr = today.getFullYear() + '-'
    + String(today.getMonth() + 1).padStart(2, '0') + '-'
    + String(today.getDate()).padStart(2, '0');
  cf.transactions.push({ id: Date.now(), type: cfMode, amount: amt, cat, note, date: dateStr });
  saveCF(); renderAll();
  $('cfModal').classList.remove('show');
});

[$('cfAmt'), $('cfNote')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') $('cfConfirm').click(); });
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Sync: re-render when another tab/page updates cashflow
window.addEventListener('storage', e => { if (e.key === K_CF) { cf = loadCF(); renderAll(); } });

renderAll();
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  try { if (window.self !== window.top) return; } catch (e) { return; }
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'finance',
    syncedKeys: ['jarvis_cf'],
    onApplied: function () { window.dispatchEvent(new Event('storage')); }
  });
});
</script>
</body>
</html>
